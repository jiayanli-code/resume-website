<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>李佳燕 · 个人简历</title>
    <style>
        /* ===== 全局重置 & 变量 ===== */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #3ddc97;
            --primary-light: #aef5d6;
            --primary-dark: #14b88a;
            --secondary: #5eead4;
            --accent: #2dd4bf;
            --bg: #f8fafc;
            --bg-card: #ffffff;
            --bg-card-hover: #f1f5f9;
            --text: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --border: #e2e8f0;
            --shadow: 0 4px 24px rgba(61, 220, 151, 0.10);
            --shadow-hover: 0 12px 40px rgba(61, 220, 151, 0.18);
            --radius: 16px;
            --radius-sm: 8px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
            --max-width: 1200px;
            --nav-height: 68px;
        }

        /* 深色模式 */
        [data-theme="dark"] {
            --bg: #0f0f1a;
            --bg-card: #1a1a2e;
            --bg-card-hover: #252540;
            --text: #eef2ff;
            --text-secondary: #b9c0d4;
            --text-muted: #6b7280;
            --border: #2d2d4a;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.40);
            --shadow-hover: 0 12px 40px rgba(61, 220, 151, 0.25);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            transition: background var(--transition), color var(--transition);
            padding-top: var(--nav-height);
            min-height: 100vh;
        }

        /* ===== 滚动条 ===== */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary-light);
            border-radius: 3px;
        }

        /* ===== 工具类 ===== */
        .container {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 24px;
        }

        .section {
            padding: 48px 0 32px;
            border-bottom: 1px solid var(--border);
        }
        .section:last-of-type {
            border-bottom: none;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text);
        }
        .section-title::after {
            content: '';
            flex: 1;
            height: 2px;
            background: linear-gradient(90deg, var(--primary), transparent);
        }
        .section-title .badge-count {
            font-size: 0.75rem;
            font-weight: 500;
            background: var(--primary);
            color: #fff;
            padding: 0 10px;
            border-radius: 20px;
            line-height: 22px;
        }

        /* ===== 导航栏 ===== */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--nav-height);
            z-index: 1000;
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: saturate(180%) blur(12px);
            -webkit-backdrop-filter: saturate(180%) blur(12px);
            border-bottom: 1px solid var(--border);
            transition: background var(--transition), border-color var(--transition);
        }
        [data-theme="dark"] .navbar {
            background: rgba(15, 15, 26, 0.78);
        }

        .navbar .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 100%;
        }

        .navbar .brand {
            font-weight: 700;
            font-size: 1.15rem;
            letter-spacing: -0.02em;
            color: var(--text);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .navbar .brand .highlight {
            color: var(--primary);
        }

        .navbar .nav-links {
            display: flex;
            align-items: center;
            gap: 6px;
            list-style: none;
            flex-wrap: wrap;
        }
        .navbar .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            padding: 6px 14px;
            border-radius: 20px;
            transition: background var(--transition), color var(--transition);
        }
        .navbar .nav-links a:hover {
            background: var(--primary);
            color: #fff;
        }

        .navbar .actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .navbar .actions button {
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            padding: 6px 8px;
            border-radius: 8px;
            color: var(--text-secondary);
            transition: background var(--transition), color var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .navbar .actions button:hover {
            background: var(--bg-card-hover);
            color: var(--text);
        }
        [data-theme="dark"] .navbar .actions button:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .navbar .menu-toggle {
            display: none;
            font-size: 1.3rem;
        }

        /* 移动端导航 */
        @media (max-width: 820px) {
            .navbar .nav-links {
                position: fixed;
                top: var(--nav-height);
                left: 0;
                right: 0;
                background: var(--bg-card);
                border-bottom: 1px solid var(--border);
                flex-direction: column;
                padding: 16px 24px;
                gap: 4px;
                transform: translateY(-120%);
                transition: transform 0.3s ease;
                box-shadow: var(--shadow);
                border-radius: 0 0 var(--radius) var(--radius);
                pointer-events: none;
            }
            .navbar .nav-links.open {
                transform: translateY(0);
                pointer-events: auto;
            }
            .navbar .nav-links a {
                width: 100%;
                padding: 10px 16px;
            }
            .navbar .menu-toggle {
                display: flex;
            }
            .navbar .actions .hide-mobile {
                display: none;
            }
        }

        /* ===== Hero ===== */
        .hero {
            position: relative;
            overflow: hidden;
            padding: 40px 0 32px;
            background: linear-gradient(145deg, rgba(61, 220, 151, 0.06), rgba(94, 234, 212, 0.04));
            border-bottom: 1px solid var(--border);
        }
        /* 鼠标光晕：跟随指针的青色径向渐变 */
        .hero::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background: radial-gradient(420px circle at var(--mx, 50%) var(--my, 50%),
                rgba(61, 220, 151, 0.30), rgba(61, 220, 151, 0.12) 35%, transparent 60%);
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .hero:hover::before {
            opacity: 1;
        }
        .hero .container {
            position: relative;
            z-index: 1;
        }
        [data-theme="dark"] .hero {
            background: linear-gradient(145deg, rgba(61, 220, 151, 0.12), rgba(94, 234, 212, 0.06));
        }

        .hero .grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 40px;
            align-items: center;
        }

        .hero h1 {
            font-size: 2.4rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.2;
            margin-bottom: 8px;
        }
        .hero h1 .highlight {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero .subtitle {
            font-size: 1.05rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .hero .slogan {
            font-size: 1.15rem;
            font-weight: 500;
            color: var(--primary-dark);
            letter-spacing: 0.1em;
            margin: 4px 0 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .hero .slogan::before,
        .hero .slogan::after {
            content: '';
            display: inline-block;
            width: 18px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--primary));
        }
        .hero .slogan::after {
            background: linear-gradient(90deg, var(--primary), transparent);
        }

        .hero .summary {
            color: var(--text-secondary);
            font-size: 0.98rem;
            max-width: 520px;
            margin: 12px 0 18px;
            line-height: 1.7;
        }

        .hero .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 18px;
        }
        .hero .tags .tag {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-secondary);
            transition: all var(--transition);
        }
        .hero .tags .tag:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: rgba(61, 220, 151, 0.06);
        }

        .hero .contact-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 20px;
            margin-top: 6px;
        }
        .hero .contact-row .item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        .hero .contact-row .item .icon {
            font-size: 1.1rem;
        }
        .hero .contact-row .item a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color var(--transition);
        }
        .hero .contact-row .item a:hover {
            color: var(--primary);
        }
        .hero .contact-row .copy-btn {
            background: none;
            border: none;
            color: var(--primary);
            cursor: pointer;
            font-size: 0.8rem;
            padding: 0 4px;
            transition: opacity var(--transition);
        }
        .hero .contact-row .copy-btn:hover {
            opacity: 0.7;
        }

        .hero .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }
        .hero .stats .stat-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 18px 16px;
            text-align: center;
            border: 1px solid var(--border);
            transition: all var(--transition);
            box-shadow: var(--shadow);
        }
        .hero .stats .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-hover);
        }
        .hero .stats .stat-card .number {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .hero .stats .stat-card .label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        @media (max-width: 820px) {
            .hero .grid {
                grid-template-columns: 1fr;
                gap: 28px;
            }
            .hero h1 {
                font-size: 1.9rem;
            }
            .hero .slogan {
                font-size: 1rem;
                letter-spacing: 0.08em;
            }
            .hero .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 480px) {
            .hero .stats {
                grid-template-columns: 1fr 1fr;
            }
            .hero .contact-row {
                flex-direction: column;
                gap: 6px;
            }
        }

        /* ===== 亮点成果 ===== */
        .highlights-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
        }
        .highlights-grid .hl-item {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 20px 18px;
            border: 1px solid var(--border);
            text-align: center;
            transition: box-shadow 0.25s ease, border-color 0.25s ease, background-color 0.25s ease, transform 0s;
            box-shadow: var(--shadow);
        }
        .highlights-grid .hl-item:hover {
            box-shadow: var(--shadow-hover);
            border-color: var(--primary-light);
        }
        .highlights-grid .hl-item .hl-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
        }
        .highlights-grid .hl-item .hl-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        /* ===== Tabs ===== */
        .tabs-container {
            margin-top: 4px;
        }
        .tabs-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 2px;
            margin-bottom: 24px;
        }
        .tabs-nav button {
            background: transparent;
            border: none;
            padding: 10px 20px;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: var(--radius-sm) var(--radius-sm) 0 0;
            transition: all var(--transition);
            position: relative;
            font-family: var(--font);
        }
        .tabs-nav button::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 50%;
            width: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 2px;
            transition: all var(--transition);
            transform: translateX(-50%);
        }
        .tabs-nav button:hover {
            color: var(--text);
            background: var(--bg-card-hover);
        }
        .tabs-nav button.active {
            color: var(--primary);
        }
        .tabs-nav button.active::after {
            width: 70%;
        }
        .tabs-nav button .tab-badge {
            background: var(--primary);
            color: #fff;
            font-size: 0.65rem;
            font-weight: 600;
            padding: 0 8px;
            border-radius: 12px;
            line-height: 18px;
            margin-left: 6px;
        }

        .tab-panel {
            display: none;
            animation: fadeUp 0.3s ease;
        }
        .tab-panel.active {
            display: block;
        }

        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(12px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== 经历卡片 ===== */
        .experience-item {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 24px 28px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            transition: box-shadow 0.25s ease, border-color 0.25s ease, background-color 0.25s ease, transform 0s;
        }
        .experience-item:hover {
            box-shadow: var(--shadow-hover);
            border-color: var(--primary-light);
        }
        .experience-item .exp-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 6px;
        }
        .experience-item .exp-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text);
        }
        .experience-item .exp-org {
            font-weight: 600;
            color: var(--primary);
        }
        .experience-item .exp-period {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
        }
        .experience-item .exp-role {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }
        .experience-item .exp-desc {
            list-style: none;
            padding: 0;
        }
        .experience-item .exp-desc li {
            position: relative;
            padding-left: 20px;
            margin-bottom: 5px;
            font-size: 0.92rem;
            color: var(--text-secondary);
            line-height: 1.6;
        }
        .experience-item .exp-desc li::before {
            content: '▹';
            position: absolute;
            left: 0;
            color: var(--primary);
            font-weight: 700;
        }
        .experience-item .exp-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
        }
        .experience-item .exp-tags .tag {
            background: rgba(61, 220, 151, 0.08);
            color: var(--primary);
            font-size: 0.7rem;
            font-weight: 600;
            padding: 2px 14px;
            border-radius: 20px;
            border: 1px solid rgba(61, 220, 151, 0.12);
        }
        [data-theme="dark"] .experience-item .exp-tags .tag {
            background: rgba(61, 220, 151, 0.18);
        }

        /* ===== 项目卡片 ===== */
        .project-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }
        @media (max-width: 720px) {
            .project-grid {
                grid-template-columns: 1fr;
            }
        }
        .project-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 22px 24px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            transition: all var(--transition);
            display: flex;
            flex-direction: column;
        }
        .project-card:hover {
            box-shadow: var(--shadow-hover);
            border-color: var(--primary-light);
        }
        .project-card .proj-name {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 4px;
        }
        .project-card .proj-tech {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 8px;
            margin: 6px 0 10px;
        }
        .project-card .proj-tech span {
            font-size: 0.7rem;
            font-weight: 500;
            background: rgba(61, 220, 151, 0.08);
            color: var(--primary);
            padding: 2px 12px;
            border-radius: 12px;
        }
        [data-theme="dark"] .project-card .proj-tech span {
            background: rgba(61, 220, 151, 0.18);
        }
        .project-card .proj-desc {
            font-size: 0.9rem;
            color: var(--text-secondary);
            flex: 1;
            margin-bottom: 12px;
            line-height: 1.6;
        }
        .project-card .proj-result {
            font-size: 0.85rem;
            color: var(--text);
            background: rgba(6, 182, 212, 0.08);
            padding: 8px 14px;
            border-radius: var(--radius-sm);
            border-left: 3px solid var(--accent);
            margin-bottom: 12px;
        }
        .project-card .proj-links {
            display: flex;
            gap: 12px;
            font-size: 0.85rem;
        }
        .project-card .proj-links a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            transition: color var(--transition);
        }
        .project-card .proj-links a:hover {
            color: var(--secondary);
            text-decoration: underline;
        }
        .project-card .proj-status {
            font-size: 0.8rem;
            color: var(--text-muted);
            background: var(--bg-card-hover);
            padding: 6px 12px;
            border-radius: 20px;
            display: inline-block;
            border: 1px solid var(--border);
        }

        /* ===== 技能矩阵 ===== */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
        }
        @media (max-width: 720px) {
            .skills-grid {
                grid-template-columns: 1fr;
            }
        }
        .skill-category h4 {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 10px;
        }
        .skill-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
        }
        .skill-item .skill-name {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        .skill-item .skill-bar {
            flex: 1;
            height: 6px;
            background: var(--border);
            border-radius: 4px;
            margin: 0 12px;
            overflow: hidden;
        }
        .skill-item .skill-bar .fill {
            height: 100%;
            border-radius: 4px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            transition: width 0.8s ease;
            width: 0%;
        }
        .skill-item .skill-level {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            min-width: 36px;
            text-align: right;
        }

        /* ===== 教育 & 证书 ===== */
        .edu-cert-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 28px;
            align-items: stretch;
        }
        .edu-cert-grid > div {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .edu-cert-grid .edu-card,
        .edu-cert-grid .cert-list {
            flex: 0 0 auto;
        }
        .edu-cert-grid .interests-grid,
        .edu-cert-grid .artworks-section {
            flex: 1 1 auto;
            margin-top: 0 !important;
        }
        .edu-cert-grid .interests-grid {
            align-content: start;
        }
        .edu-cert-grid .interest-item {
            height: auto;
        }
        .edu-cert-grid .artwork-intro {
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin-top: 0 !important;
        }
        @media (max-width: 720px) {
            .edu-cert-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            .edu-cert-grid > div {
                display: block;
            }
            .edu-cert-grid .interests-grid,
            .edu-cert-grid .artworks-section {
                flex: none;
                margin-top: 18px !important;
            }
            .edu-cert-grid .artworks-section {
                margin-top: 24px !important;
            }
            .edu-cert-grid .artwork-intro {
                flex: none;
                display: block;
                margin-top: 18px !important;
            }
        }

        .edu-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 24px 28px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }
        .edu-card .edu-school {
            font-size: 1.1rem;
            font-weight: 700;
        }
        .edu-card .edu-major {
            font-weight: 600;
            color: var(--primary);
        }
        .edu-card .edu-period {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* 3D 倾斜：仅过渡阴影/边框/背景，transform 交给 JS 逐帧，避免双重缓动卡顿 */
        .fx-tilt {

        .fx-tilt > * {

        // 轮播控制
        let carouselInterval = null;
        let artworkIndex = 0;

        // 让容器高度跟随当前照片的实际高度（尽量接近原图尺寸，不裁切）
        // 手机端(<=720px)为平铺网格，不应用此高度
        function fitArtworkHeight(container) {
            if (!container) return;
            if (window.innerWidth <= 720) { container.style.height = ''; return; }
            const cap = Math.min(window.innerHeight * 0.5, 320);
            const active = container.querySelector('.artwork-item.active') || container.querySelector('.artwork-item');
            const img = active && active.querySelector('img');
            if (img && img.naturalWidth) {
                container.style.height = Math.min(img.naturalHeight, cap) + 'px';
            } else {
                container.style.height = '320px';
            }
        }

        // 切换到第 n 张（覆盖式：新卡从右侧滑入盖住旧卡）
        function goArtwork(items, dots, n) {
            items[artworkIndex].classList.remove('active');
            dots[artworkIndex].classList.remove('on');
            artworkIndex = (n + items.length) % items.length;
            items[artworkIndex].classList.add('active');
            dots[artworkIndex].classList.add('on');
            const container = items[0].closest('.artworks-scroll');
            if (container) fitArtworkHeight(container);
        }

        function startCarousel() {
            const container = document.getElementById('artworksScroll');
            if (!container) return;
            const items = container.querySelectorAll('.artwork-item');
            if (!items.length) return;
            if (artworkIndex >= items.length) artworkIndex = 0;

            // 确保当前张有 active（首屏不闪白）
            if (!container.querySelector('.artwork-item.active')) {
                items[artworkIndex].classList.add('active');
            }

            // 容器高度跟随图片实际高度（照片按原比例完整显示）
            fitArtworkHeight(container);
            items.forEach(item => {
                const im = item.querySelector('img');
                if (im && !im.dataset.fitBound) {
                    im.dataset.fitBound = '1';
                    im.addEventListener('load', () => {
                        if (item.classList.contains('active')) fitArtworkHeight(container);
                    });
                }
            });

            // 生成底部小圆点（只在第一次建，避免重复）
            let dotsBox = container.parentElement.querySelector('.artworks-dots');
            if (!dotsBox) {
                dotsBox = document.createElement('div');
                dotsBox.className = 'artworks-dots';
                container.parentElement.appendChild(dotsBox);
            }
            if (!dotsBox.dataset.built) {
                dotsBox.innerHTML = '';
                items.forEach((_, idx) => {
                    const b = document.createElement('b');
                    if (idx === artworkIndex) b.className = 'on';
                    b.addEventListener('click', () => {
                        if (carouselInterval) clearInterval(carouselInterval);
                        goArtwork(items, [...dotsBox.children], idx);
                        carouselInterval = setInterval(() => goArtwork(items, [...dotsBox.children], artworkIndex + 1), 3000);
                    });
                    dotsBox.appendChild(b);
                });
                dotsBox.dataset.built = '1';
            }
            const dots = [...dotsBox.children];

            // 自动播放：每 3 秒切下一张，循环
            if (carouselInterval) clearInterval(carouselInterval);
            carouselInterval = setInterval(() => goArtwork(items, dots, artworkIndex + 1), 3000);

            // 悬停暂停（只绑一次）
            const wrapper = container.closest('.artworks-scroll-wrapper');
            if (wrapper && !wrapper.dataset.carouselBound) {
                wrapper.addEventListener('mouseenter', () => { if (carouselInterval) clearInterval(carouselInterval); });
                wrapper.addEventListener('mouseleave', () => {
                    if (carouselInterval) clearInterval(carouselInterval);
                    carouselInterval = setInterval(() => goArtwork(items, dots, artworkIndex + 1), 3000);
                });
                wrapper.dataset.carouselBound = '1';
            }

            // 窗口缩放时重新计算高度（手机/桌面切换）
            if (!window.__artworkResizeBound) {
                window.__artworkResizeBound = '1';
                window.addEventListener('resize', () => fitArtworkHeight(container));
            }
        }

        function renderEducation() {
            const e = resume.education;
            const el = document.getElementById('eduCard');
            el.innerHTML = `
            <div class="edu-school">${e.school}</div>
            <div class="edu-major">${e.major} · 本科（在读）</div>
            <div class="edu-period">${e.period} | ${e.location}</div>
            <div class="edu-detail">🏫 高中：${e.highSchool}</div>
            <div class="edu-courses">
              ${e.courses.map(c => `<span>${c}</span>`).join('')}
            </div>
            <div class="edu-detail" style="margin-top:10px;font-size:0.88rem;">${e.extra}</div>
          `;

            const certEl = document.getElementById('certList');
            certEl.innerHTML = resume.certificates.map(c => {
                let imgHtml = '';
                if (c.image) {
                    imgHtml = `<div class="cert-image"><img src="${c.image}" alt="${c.name}证书" loading="lazy"></div>`;
                }
                return `
              <div class="cert-item">
                <div class="cert-name">${c.name}</div>
                <div class="cert-meta">${c.meta}</div>
                <div class="cert-desc">${c.description}</div>
                ${imgHtml}
              </div>
            `;
            }).join('');

            const intEl = document.getElementById('interestsGrid');
            intEl.innerHTML = resume.interests.map(i => `
            <div class="interest-item">
              <div class="interest-icon">${i.icon}</div>
              <div class="interest-name">${i.name}</div>
              <div class="interest-desc">${i.desc}</div>
            </div>
          `).join('');

            // ---- 剪纸艺术作品集介绍（左下角） ----
            const intro = resume.artworkIntro;
            const introEl = document.getElementById('artworkIntro');
            if (intro && introEl) {
                introEl.innerHTML = `
                <h4><span class="artwork-intro__icon">✂️</span>${intro.name}</h4>
                <div class="artwork-intro__meta">${intro.meta}</div>
                <p>${intro.description}</p>
              `;
            } else if (introEl) {
                introEl.innerHTML = '';
            }

            // ---- 剪纸作品集 - 单份列表，自动滚动循环 ----
            const artworksEl = document.getElementById('artworksSection');
            if (resume.artworks && resume.artworks.length > 0) {
                let html = `
              <h4>✂️ 剪纸作品集</h4>
              <div class="artworks-scroll-wrapper">
                <div class="artworks-scroll" id="artworksScroll">
                  ${resume.artworks.map((file, ai) => `
                    <div class="artwork-item${ai === 0 ? ' active' : ''}">
                      <img src="${file}" alt="剪纸作品" loading="lazy">
                    </div>
                  `).join('')}
                </div>
              </div>
            `;
                artworksEl.innerHTML = html;

                // 启动轮播（延迟以确保DOM渲染完成）
                setTimeout(startCarousel, 50);
            } else {
                artworksEl.innerHTML = '';
            }
        }

        // ============================================================
        //  交互
        // ============================================================

        function toggleTheme() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', next);
            document.getElementById('themeIcon').textContent = next === 'dark' ? '☀️' : '🌙';
            localStorage.setItem('theme', next);
        }

        function initTheme() {
            const saved = localStorage.getItem('theme');
            const prefers = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            const theme = saved || prefers;
            document.documentElement.setAttribute('data-theme', theme);
            document.getElementById('themeIcon').textContent = theme === 'dark' ? '☀️' : '🌙';
        }

        function copyEmail() {
            const email = resume.personal.contact.email;
            navigator.clipboard.writeText(email).then(() => {
                const btn = document.querySelector('.copy-btn');
                const orig = btn.textContent;
                btn.textContent = '✅';
                setTimeout(() => { btn.textContent = orig; }, 2000);
            }).catch(() => {
                const input = document.createElement('input');
                input.value = email;
                document.body.appendChild(input);
                input.select();
                document.execCommand('copy');
                document.body.removeChild(input);
                const btn = document.querySelector('.copy-btn');
                const orig = btn.textContent;
                btn.textContent = '✅';
                setTimeout(() => { btn.textContent = orig; }, 2000);
            });
        }

        // 通用复制：点击文本即复制，带"已复制"反馈（兼容 file:// 本地打开）
        function copyText(text, el) {
            const done = () => {
                if (!el) return;
                const hint = el.querySelector('.copy-hint');
                const orig = hint ? hint.textContent : el.textContent;
                el.classList.add('copied');
                if (hint) hint.textContent = '✅ 已复制';
                else el.textContent = '✅ 已复制';
                setTimeout(() => {
                    el.classList.remove('copied');
                    if (hint) hint.textContent = orig;
                    else el.textContent = orig;
                }, 2000);
            };
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
            } else {
                fallbackCopy(text, done);
            }
        }
        function fallbackCopy(text, done) {
            const input = document.createElement('input');
            input.value = text;
            input.style.position = 'fixed';
            input.style.opacity = '0';
            document.body.appendChild(input);
            input.select();
            try { document.execCommand('copy'); done(); } catch (e) {}
            document.body.removeChild(input);
        }

        // 渲染页脚联系方式（手机号 / 微信 / 邮箱，均可点击复制）
        function renderFooterContact() {
            const c = resume.personal.contact;
            const el = document.getElementById('footerContact');
            if (!el) return;
            const items = [
                { icon: '📱', text: c.phone, copy: c.phone },
                { icon: '💬', text: '微信：' + c.wechat, copy: c.wechat },
                { icon: '📧', text: c.email, copy: c.email }
            ];
            el.innerHTML = items.map(it => `
                <span class="copy-item" onclick="copyText('${it.copy}', this)">
                    <span class="ci-icon">${it.icon}</span> ${it.text}
                    <span class="copy-hint">点击复制</span>
                </span>
            `).join('');
        }

        function initBackTop() {
            const btn = document.getElementById('backTop');
            window.addEventListener('scroll', () => {
                if (window.scrollY > 400) {
                    btn.classList.add('visible');
                } else {
                    btn.classList.remove('visible');
                }
            });
            btn.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }

        // 背景音乐：导航栏小图标点击展开/收起播放器面板
        function initBgmToggle() {
            const toggle = document.getElementById('bgmToggle');
            const panel = document.getElementById('bgmPanel');
            if (!toggle || !panel) return;

            toggle.addEventListener('click', (e) => {
                e.stopPropagation();
                const isOpen = panel.classList.toggle('open');
                toggle.classList.toggle('active', isOpen);
                toggle.setAttribute('aria-expanded', String(isOpen));
            });

            // 点击面板外部或按 ESC 关闭
            document.addEventListener('click', (e) => {
                if (!panel.contains(e.target) && !toggle.contains(e.target)) {
                    panel.classList.remove('open');
                    toggle.classList.remove('active');
                    toggle.setAttribute('aria-expanded', 'false');
                }
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && panel.classList.contains('open')) {
                    panel.classList.remove('open');
                    toggle.classList.remove('active');
                    toggle.setAttribute('aria-expanded', 'false');
                }
            });
        }

        function initMobileMenu() {
            const toggle = document.getElementById('menuToggle');
            const links = document.getElementById('navLinks');
            toggle.addEventListener('click', () => {
                const open = links.classList.toggle('open');
                toggle.setAttribute('aria-expanded', open);
                toggle.textContent = open ? '✕' : '☰';
            });
            $$('a', links).forEach(a => {
                a.addEventListener('click', () => {
                    links.classList.remove('open');
                    toggle.setAttribute('aria-expanded', 'false');
                    toggle.textContent = '☰';
                });
            });
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.navbar')) {
                    links.classList.remove('open');
                    toggle.setAttribute('aria-expanded', 'false');
                    toggle.textContent = '☰';
                }
            });
        }

        // ============================================================
        //  启动
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            initTheme();
            renderHero();
            renderHighlights();
            renderExperience();
            renderProjects();
            renderSkills();
            renderEducation();
            renderFooterContact();
            initBackTop();
            initMobileMenu();
            initBgmToggle();

            // ===== 动效1：滚动错落淡入 =====
            // 标题与卡片网格容器加 reveal，进入视口时上浮淡入
            document.querySelectorAll('.section-title').forEach(t => {
                t.classList.add('reveal');
                t.setAttribute('data-delay', '0');
            });
            ['#highlightsGrid', '#experienceTabs', '#projectTabs', '#skillsGrid', '.edu-cert-grid'].forEach(sel => {
                const el = document.querySelector(sel);
                if (el) { el.classList.add('reveal'); el.setAttribute('data-delay', '1'); }
            });
            const revealObserver = new IntersectionObserver((entries) => {
                entries.forEach(e => {
                    if (e.isIntersecting) {
                        e.target.classList.add('in');
                        revealObserver.unobserve(e.target);
                    }
                });
            }, { threshold: 0.12 });
            document.querySelectorAll('.reveal').forEach(el => revealObserver.observe(el));
            // 兜底：极端情况下保证内容可见
            setTimeout(() => {
                document.querySelectorAll('.reveal:not(.in)').forEach(el => el.classList.add('in'));
            }, 2600);

            // ===== 动效2：卡片 3D 倾斜（rAF 逐帧插值，丝滑跟手）=====
            const TILT_MAX = 10, TILT_SMOOTH = 0.18;
            function initCardTilt(card) {
                card.classList.add('fx-tilt');
                let targetX = 0, targetY = 0, curX = 0, curY = 0, raf = null, hovering = false;
                function animate() {
                    curX += (targetX - curX) * TILT_SMOOTH;
                    curY += (targetY - curY) * TILT_SMOOTH;
                    const scale = hovering ? 1.03 : 1;
                    card.style.transform = `perspective(1000px) rotateX(${curX}deg) rotateY(${curY}deg) scale(${scale})`;
                    if (Math.abs(targetX - curX) > 0.01 || Math.abs(targetY - curY) > 0.01 || hovering) {
                        raf = requestAnimationFrame(animate);
                    } else {
                        raf = null;
                    }
                }
                function kick() { if (!raf) raf = requestAnimationFrame(animate); }
                card.addEventListener('mousemove', (ev) => {
                    const r = card.getBoundingClientRect();
                    const px = (ev.clientX - r.left) / r.width;
                    const py = (ev.clientY - r.top) / r.height;
                    targetY = (px - 0.5) * 2 * TILT_MAX;
                    targetX = -(py - 0.5) * 2 * TILT_MAX;
                    kick();
                });
                card.addEventListener('mouseenter', () => { hovering = true; kick(); });
                card.addEventListener('mouseleave', () => { hovering = false; targetX = 0; targetY = 0; kick(); });
            }
            document.querySelectorAll('.project-card, .skill-category, .edu-card, .cert-item, .interest-item, .hl-item, .artwork-intro, .experience-item')
                .forEach(initCardTilt);

            // hero 鼠标光晕：跟随指针更新光晕坐标
            const heroEl = document.getElementById('section-hero');
            if (heroEl) {
                heroEl.addEventListener('pointermove', function(e) {
                    const r = heroEl.getBoundingClientRect();
                    heroEl.style.setProperty('--mx', (e.clientX - r.left) + 'px');
                    heroEl.style.setProperty('--my', (e.clientY - r.top) + 'px');
                });
            }

            $$('a[href^="#"]').forEach(a => {
                a.addEventListener('click', function(e) {
                    const target = document.querySelector(this.getAttribute('href'));
                    if (target) {
                        e.preventDefault();
                        const top = target.getBoundingClientRect().top + window.scrollY - 80;
                        window.scrollTo({ top, behavior: 'smooth' });
                    }
                });
            });

            window.addEventListener('beforeprint', () => {
                $$('.tab-panel').forEach(p => p.style.display = 'block');
                if (carouselInterval) clearInterval(carouselInterval);
            });
            window.addEventListener('afterprint', () => {
                $$('.tab-panel').forEach(p => p.style.display = '');
                $$('.tab-panel.active').forEach(p => p.style.display = 'block');
                // 重新启动轮播
                setTimeout(startCarousel, 100);
            });

            // 页面可见性变化
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    if (carouselInterval) clearInterval(carouselInterval);
                } else {
                    setTimeout(startCarousel, 100);
                }
            });

            // 窗口大小变化时重新计算
            let resizeTimer;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => {
                    if (carouselInterval) clearInterval(carouselInterval);
                    setTimeout(startCarousel, 100);
                }, 300);
            });
        });
    </script>
